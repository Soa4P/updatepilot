name: "UpdatePilot"
description: >-
  Dependency update bot whose every PR arrives pre-reviewed by a full-file AI
  review. Scan mode opens update PRs under your policy; review mode attaches the
  verdict comment and label. The bot never merges and never approves.
author: "Soa4P"

branding:
  icon: "navigation"
  color: "blue"

inputs:
  mode:
    description: >-
      scan (open pre-reviewed update PRs), review (attach full-file review to
      PR_NUMBER), or audit (repo-wide sweep → labelled issue, deduped)
    required: true
  github_token:
    description: "Token for branch/PR/label API calls; pass secrets.GITHUB_TOKEN"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install UpdatePilot
      # action_ref is the ref the caller used in `uses:`; interpolated via env,
      # not into the script text — action inputs are untrusted by convention.
      shell: bash
      env:
        UPDATEPILOT_SOURCE: git+${{ github.server_url }}/${{ github.action_repository }}.git@${{ github.action_ref }}
      run: pip install "$UPDATEPILOT_SOURCE"

    - name: Run
      shell: bash
      # `mode` is an action input = caller-controlled text. It reaches the shell
      # ONLY through the env block: `updatepilot ${{ inputs.mode }}` would let a
      # caller's untrusted value (e.g. a branch name in their automation) inject
      # arbitrary commands with this job's GITHUB_TOKEN and API key in scope.
      env:
        UPDATEPILOT_MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        UPDATEPILOT_REPO: ${{ github.workspace }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        # Only used for the guard below; never trusted for anything else.
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        case "$UPDATEPILOT_MODE" in
          scan|review|audit) ;;
          *) echo "::error::mode 必须是 scan / review / audit，收到: $UPDATEPILOT_MODE"; exit 1 ;;
        esac

        # `pull_request_target` runs with secrets in scope, so *what runs* has to be the
        # base commit's code and config. If the caller checked out the PR head instead,
        # the PR author has written the program and its `.github/updatepilot.yml` — a
        # config file this action would then trust (audit S-UP-05). Refuse loudly rather
        # than review the PR with the PR's own code.
        if [ -n "$PR_HEAD_SHA" ] && [ "$UPDATEPILOT_MODE" = "review" ]; then
          head_now="$(git -C "$UPDATEPILOT_REPO" rev-parse HEAD 2>/dev/null || echo unknown)"
          if [ "$head_now" = "$PR_HEAD_SHA" ]; then
            echo "::error::workspace HEAD is the PR head commit. In review mode check out the base ref:"
            echo "::error::  uses: actions/checkout@<sha>"
            echo "::error::  with: { ref: \${{ github.event.pull_request.base.sha }} }"
            exit 1
          fi
        fi

        updatepilot "$UPDATEPILOT_MODE"
